name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          - laravel: '13.*'
            php: '8.2'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Pest
        run: vendor/bin/pest --ci --parallel

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd
          coverage: pcov

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pest with coverage (minimum 90 %)
        run: vendor/bin/pest --ci --coverage --min=90 --coverage-clover=coverage/clover.xml

      - name: Summary
        if: always()
        run: |
          if [ -f coverage/clover.xml ]; then
            php -r '$x = simplexml_load_file("coverage/clover.xml")->project->metrics; printf("### PHP coverage: %.1f %%\n", 100 * (int) $x["coveredstatements"] / max(1, (int) $x["statements"]));' >> "$GITHUB_STEP_SUMMARY"
          fi
